[package]
name = "git-exile"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.33", features = ["persistence"] }
thiserror = "2.0.21"
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "signatures"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
flate2 = "1.1.10"
tar = "0.4.46"
tempfile = "3.27.0"
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }
zipsign-api = "0.2.2"

[profile.release]
lto = "thin"
strip = true
