[package]
name = "git-exile"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.33", features = ["persistence"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
