name: Release

# Con una etiqueta `v*` publica los ejecutables en una Release. A mano
# (workflow_dispatch) solo prueba y compila, sin publicar nada.
#
# El secreto UPDATE_SIGNING_KEY contiene, en base64, la clave privada que corresponde a
# assets/update-signing.pub. Sin él no se publica nada: la aplicación rechazaría los archivos.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Una distro antigua: el binario depende de la glibc con la que se compila.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Tests
        run: cargo test --locked

      - name: Compilar
        run: cargo build --release --locked

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir package
          cp target/release/git-exile LICENSE assets/git-exile.desktop package/
          cp assets/icon-256.png package/git-exile.png
          tar -czf git-exile-${{ matrix.name }}.tar.gz -C package .

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/git-exile.exe, LICENSE -DestinationPath git-exile-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: git-exile-${{ matrix.name }}
          path: git-exile-${{ matrix.name }}.*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Instalar zipsign
        run: cargo install zipsign --version 0.2.2 --locked
      - name: Firmar
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Falta el secreto UPDATE_SIGNING_KEY"
            exit 1
          fi
          key="$RUNNER_TEMP/update-signing.key"
          trap 'rm -f "$key"' EXIT
          (umask 077; base64 --decode <<<"$UPDATE_SIGNING_KEY" > "$key")
          zipsign sign tar git-exile-linux-x86_64.tar.gz "$key"
          zipsign sign zip git-exile-windows-x86_64.zip "$key"
      # Detecta un secreto que no corresponde a la clave incluida en la aplicación.
      - name: Verificar firmas
        run: |
          zipsign verify tar git-exile-linux-x86_64.tar.gz source/assets/update-signing.pub
          zipsign verify zip git-exile-windows-x86_64.zip source/assets/update-signing.pub
      - uses: softprops/action-gh-release@v2
        with:
          files: git-exile-*
          generate_release_notes: true
